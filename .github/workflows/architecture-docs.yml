name: Architecture HTML

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify architecture HTML is current
        run: node scripts/generate-architecture.cjs --check

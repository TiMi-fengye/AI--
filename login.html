<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 华北一部酒仙桥人力资源管理平台</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050b18">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/style.css?v=20261112sms">
  <link rel="stylesheet" href="css/theme.css?v=20261112sms">
  <style>
    [hidden] { display: none !important; }
    body { margin:0; min-height:100vh; min-height:100dvh; overflow-y:auto; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; color:#edf2ff; background:#050b18; }
    .login-background { position:fixed; inset:0; z-index:-1; background:linear-gradient(110deg,rgba(3,9,24,.75),rgba(5,20,43,.55)),url('login-bg.png') center / cover no-repeat; }
    .login-wrapper { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
    .login-container { width:440px; max-width:100%; transition:width .18s ease; }
    .login-container.registration-mode { width:900px; }
    .login-card { padding:36px; background:rgba(10,22,45,.88); border:1px solid rgba(172,200,255,.14); border-radius:24px; box-shadow:0 24px 80px #0006; backdrop-filter:blur(22px); }
    .login-brand { text-align:center; margin-bottom:26px; }
    .brand-icon { margin:0 auto 14px; display:grid; place-items:center; width:62px; height:62px; border-radius:18px; background:linear-gradient(135deg,#3f8cff,#16c9e8); font-size:28px; }
    .brand-title { font-size:20px; line-height:1.65; color:#e7eeff; }
    .brand-sub { margin-top:6px; color:#8599bc; font-size:10px; letter-spacing:2px; }
    .auth-tabs { display:flex; padding:4px; border-radius:12px; margin-bottom:24px; background:#ffffff08; border:1px solid #ffffff0d; }
    .auth-tabs button { flex:1; border:0; padding:10px; font:inherit; font-size:14px; color:#93a7c9; border-radius:9px; background:transparent; cursor:pointer; }
    .auth-tabs button[aria-selected="true"] { background:#4f8cff29; color:#dbe9ff; }
    .login-card .form-group { margin-bottom:18px; }
    .login-card label { display:block; margin-bottom:7px; font-size:13px; color:#adc0df; }
    .login-card .form-control { width:100%; min-height:44px; padding:11px 13px; border:1px solid #ffffff1f; border-radius:10px; font:inherit; font-size:14px; color:#eef3ff; background:#ffffff08; color-scheme:dark; }
    .login-card .form-control::placeholder { color:#6f83a6; }
    .login-card .form-control:focus { outline:0; border-color:#559bff; box-shadow:0 0 0 3px #4f8cff1a; }
    .login-card .form-control[readonly] { opacity:.7; }
    .login-card select option { background:#122343; color:#edf2ff; }
    .login-card .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
    .login-card .form-row > .form-group { min-width:0; }
    .password-wrap { position:relative; }
    .password-wrap input { padding-right:70px !important; }
    .password-toggle { position:absolute; right:10px; top:50%; transform:translateY(-50%); border:0; background:transparent; color:#9fbdf0; padding:7px; font-size:12px; cursor:pointer; }
    .sms-row { display:flex; gap:10px; align-items:stretch; }
    .sms-row .form-control { flex:1; min-width:0; }
    .sms-send { flex:none; min-width:112px; padding:9px 12px; border:1px solid #5b9fff57; border-radius:10px; background:#4f8cff1c; color:#bed8ff; font:inherit; font-size:12px; cursor:pointer; }
    .sms-send:disabled { opacity:.55; cursor:default; }
    .sms-help { margin:7px 0 0; color:#8fa7cd; font-size:11px; line-height:1.7; }
    .login-options { display:flex; justify-content:space-between; gap:12px; margin:0 0 22px; align-items:center; font-size:12px; }
    .login-options .remember-me { display:flex; gap:7px; align-items:center; margin:0; font-size:12px; }
    .remember-me input { accent-color:#559bff; }
    .text-button { border:0; background:transparent; color:#a2bfff; font:inherit; font-size:12px; cursor:pointer; padding:0; }
    .login-btn { display:block; width:100%; padding:14px; border:0; border-radius:11px; font:inherit; font-weight:600; color:#fff; background:linear-gradient(115deg,#3f8cff,#13aecf); cursor:pointer; }
    .login-btn:hover { filter:brightness(1.1); }
    .login-btn:disabled { opacity:.6; cursor:wait; }
    .auth-intro { margin:0 0 22px; padding:13px 16px; color:#abc0df; background:#4f8cff0d; border:1px solid #4f8cff24; border-radius:10px; line-height:1.8; font-size:12px; }
    .auth-section-title { font-size:15px; margin:24px 0 16px; color:#e3ecff; }
    .login-status { margin-top:18px; padding:11px 14px; border:1px solid #ef444447; border-radius:10px; background:#ef444416; color:#fca5a5; font-size:13px; line-height:1.65; white-space:pre-line; }
    .login-status[data-kind="info"] { border-color:#60a5fa47; background:#3b82f616; color:#bdd8ff; }
    .login-footer { padding-top:22px; text-align:center; color:#7a8fac; font-size:11px; line-height:1.8; }
    .install-app-btn { display:block; margin:0 auto 14px; border:1px solid #9bbfff40; background:#4f8cff15; color:#bed3fa; border-radius:10px; padding:9px 14px; cursor:pointer; }
    .setup-entry { text-align:center; margin-top:18px; }
    #registerForm .btn { padding:7px 12px; font-size:12px; }
    #registerForm hr { border:0; border-top:1px solid #ffffff13; }
    #registerForm #empResumeName, #registerForm #empCredentialName { color:#98afd1 !important; }
    @media(max-width:600px) { .login-wrapper { padding:20px 12px; } .login-card { padding:26px 20px; border-radius:18px; } .login-card .form-row { grid-template-columns:1fr; } .brand-title { font-size:18px; } .registration-mode .login-brand { margin-bottom:20px; } }
    @media(prefers-reduced-motion:reduce) { .login-container { transition:none; } }
  </style>
</head>
<body>
  <div class="login-background" aria-hidden="true"></div>
  <main class="login-wrapper">
    <div class="login-container" id="authContainer">
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-icon" aria-hidden="true">👥</div>
          <h1 class="brand-title">华北一部酒仙桥人力资源管理平台</h1>
          <p class="brand-sub">PERSONNEL MANAGEMENT SYSTEM</p>
        </div>
        <div class="auth-tabs" role="tablist" aria-label="账号服务">
          <button type="button" id="loginTab" role="tab" aria-selected="true" aria-controls="loginPanel" onclick="showAuthMode('login')">登录</button>
          <button type="button" id="registerTab" role="tab" aria-selected="false" aria-controls="registerPanel" onclick="showAuthMode('register')">手机号注册</button>
        </div>
        <section id="loginPanel" role="tabpanel" aria-labelledby="loginTab">
          <form id="loginForm">
            <div class="form-group"><label for="loginUsername">手机号 / 管理账号</label><input type="text" class="form-control" id="loginUsername" placeholder="请输入手机号或管理账号" autocomplete="username" required maxlength="80"></div>
            <div class="form-group"><label for="loginPassword">密码</label><div class="password-wrap"><input type="password" class="form-control" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required><button class="password-toggle" type="button" onclick="togglePassword('loginPassword', this)" aria-label="显示密码">显示</button></div></div>
            <div class="form-group" id="loginSmsGroup" hidden><label for="loginSmsCode">短信验证码 *</label><div class="sms-row"><input class="form-control" id="loginSmsCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="请输入6位验证码" disabled><button class="sms-send" id="loginSmsSend" type="button" onclick="sendAuthSms('login')" disabled>获取验证码</button></div><p class="sms-help" id="loginSmsHelp" role="status"></p></div>
            <p class="sms-help" id="managementLoginHint" hidden>管理账号仅供管理员使用；人员账号请填写绑定的手机号。</p>
            <div class="login-options"><label class="remember-me"><input type="checkbox" id="rememberMe">记住账号</label><button type="button" class="text-button" onclick="showLoginStatus('忘记密码请联系管理员重置。', 'info')">忘记密码？</button></div>
            <button class="login-btn" id="loginBtn" type="submit">登录</button>
          </form>
        </section>
        <section id="registerPanel" role="tabpanel" aria-labelledby="registerTab" hidden>
          <p class="auth-intro">注册时请填写人员资料，带 * 为必填。人员性质、人员属性、工作属性、部门、状态、楼栋可稍后补充；注册后可在“我的资料”中核对和维护。</p>
          <form id="registerForm">
            <h2 class="auth-section-title">人员信息</h2>
            <div id="registrationFields"></div>
            <h2 class="auth-section-title">设置登录密码</h2>
            <div class="form-row">
              <div class="form-group"><label for="registerPassword">密码 *（至少8位）</label><input class="form-control" id="registerPassword" type="password" autocomplete="new-password" placeholder="请设置至少8位密码" minlength="8" maxlength="128" required></div>
              <div class="form-group"><label for="registerConfirm">确认密码 *</label><input class="form-control" id="registerConfirm" type="password" autocomplete="new-password" placeholder="请再次输入密码" minlength="8" maxlength="128" required></div>
            </div>
            <div class="form-group" id="registerSmsGroup" hidden><label for="registerSmsCode">短信验证码 *</label><div class="sms-row"><input class="form-control" id="registerSmsCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="请输入6位验证码" disabled><button class="sms-send" id="registerSmsSend" type="button" onclick="sendAuthSms('register')" disabled>获取验证码</button></div><p class="sms-help" id="registerSmsHelp" role="status"></p></div>
            <button class="login-btn" id="registerBtn" type="submit">注册并登录</button>
          </form>
        </section>
        <section id="setupPanel" hidden>
          <p class="auth-intro">首次使用，请在本机设置管理员密码。管理员账号为 admin，可查看全部信息并分配楼长负责的楼栋。</p>
          <form id="setupForm">
            <div class="form-group"><label for="setupPassword">管理员密码（至少12位）</label><input class="form-control" type="password" id="setupPassword" autocomplete="new-password" minlength="12" maxlength="128" required></div>
            <div class="form-group"><label for="setupConfirm">确认密码</label><input class="form-control" type="password" id="setupConfirm" autocomplete="new-password" minlength="12" maxlength="128" required></div>
            <button class="login-btn" id="setupBtn" type="submit">初始化管理员并登录</button>
          </form>
        </section>
        <div class="login-status" id="loginError" role="alert" hidden></div>
        <div class="setup-entry" id="setupEntry" hidden><button type="button" class="text-button" onclick="showAuthMode('setup')">首次使用：初始化管理员</button></div>
      </div>
      <footer class="login-footer"><button class="install-app-btn" id="installAppBtn" type="button" hidden>📲 安装到手机桌面</button>&copy; 2026 华北一部酒仙桥人力资源管理平台</footer>
    </div>
  </main>
  <script src="js/store.js?v=20261112sms"></script>
  <script src="js/auth.js?v=20261112sms"></script>
  <script src="js/employees.js?v=20261112sms"></script>
  <script src="js/mobile.js?v=20261112sms"></script>
  <script>
    // 共享人员表单的附件操作在登录页使用同一条状态提示。
    const App = { today: function() { return new Date().toISOString().slice(0, 10); }, toast: function(message, type) { showLoginStatus(message, type === 'error' ? 'error' : 'info'); } };
    let registrationReady = false;
    let authModeSequence = 0;
    const smsStates = {
      login: { phone: '', challengeId: '', expiresAt: 0, busy: false, sequence: 0 },
      register: { phone: '', challengeId: '', expiresAt: 0, busy: false, sequence: 0 }
    };
    const smsCooldownUntil = new Map();
    const pendingSmsPhones = new Set();
    let smsClock = null;
    function smsPhone(purpose) {
      const input = document.getElementById(purpose === 'login' ? 'loginUsername' : 'empPhone');
      return input ? input.value.trim() : '';
    }
    function smsNeeded(purpose) { return Auth.smsVerificationRequired && (purpose === 'register' || /^1[3-9]\d{9}$/.test(smsPhone('login'))); }
    function clearSmsChallenge(purpose) {
      const state = smsStates[purpose];
      state.sequence++;
      state.phone = '';
      state.challengeId = '';
      state.expiresAt = 0;
      state.busy = false;
      const input = document.getElementById(purpose + 'SmsCode');
      if (input) input.value = '';
    }
    function smsPhoneChanged(purpose) { clearSmsChallenge(purpose); updateSmsControls(); }
    function updateSmsControls() {
      const now = Date.now();
      for (const purpose of ['login', 'register']) {
        const state = smsStates[purpose], needed = smsNeeded(purpose), phone = smsPhone(purpose);
        const group = document.getElementById(purpose + 'SmsGroup');
        const code = document.getElementById(purpose + 'SmsCode');
        const button = document.getElementById(purpose + 'SmsSend');
        const help = document.getElementById(purpose + 'SmsHelp');
        group.hidden = !needed;
        code.required = needed;
        code.disabled = !needed || !Auth.smsConfigured;
        const remaining = Math.max(0, Math.ceil(((smsCooldownUntil.get(phone) || 0) - now) / 1000));
        if (state.challengeId && state.expiresAt <= now) {
          state.challengeId = '';
          state.expiresAt = 0;
          code.value = '';
          help.textContent = '验证码已过期，请重新获取。';
        } else if (!Auth.smsConfigured && needed) help.textContent = '短信服务尚未配置，请联系管理员。';
        else if (state.challengeId) help.textContent = '验证码有效期5分钟，仅用于本次' + (purpose === 'login' ? '登录' : '注册') + '。';
        else if (!help.textContent || !needed || phone !== state.phone) help.textContent = '验证码将发送到上方填写的手机号。';
        button.disabled = !needed || !Auth.smsConfigured || !/^1[3-9]\d{9}$/.test(phone) || state.busy || pendingSmsPhones.has(phone) || remaining > 0;
        button.textContent = state.busy ? '发送中…' : remaining > 0 ? remaining + '秒后重发' : state.challengeId ? '重新获取' : '获取验证码';
      }
      const username = smsPhone('login');
      document.getElementById('managementLoginHint').hidden = !Auth.smsVerificationRequired || !username || /^1[3-9]\d{9}$/.test(username);
    }
    async function sendAuthSms(purpose) {
      if (!Object.prototype.hasOwnProperty.call(smsStates, purpose)) return;
      const state = smsStates[purpose], phone = smsPhone(purpose);
      if (!smsNeeded(purpose)) return;
      if (!Auth.smsConfigured) { showLoginStatus('短信服务尚未配置，请联系管理员。'); return; }
      if (!/^1[3-9]\d{9}$/.test(phone)) { showLoginStatus('请输入有效的11位手机号'); return; }
      if (state.busy || pendingSmsPhones.has(phone) || (smsCooldownUntil.get(phone) || 0) > Date.now()) return;
      clearSmsChallenge(purpose);
      state.phone = phone;
      state.busy = true;
      pendingSmsPhones.add(phone);
      const sequence = state.sequence;
      updateSmsControls();
      clearLoginStatus();
      try {
        const result = await Auth.sendSmsCode(phone, purpose);
        if (typeof result.challengeId !== 'string' || result.challengeId.length < 16 || result.challengeId.length > 200 || !Number.isFinite(result.expiresIn) || result.expiresIn <= 0 || result.expiresIn > 900 || !Number.isFinite(result.retryAfter) || result.retryAfter < 0 || result.retryAfter > 86400) throw new Error('验证码发送结果无效，请稍后重试。');
        const now = Date.now();
        smsCooldownUntil.set(phone, now + result.retryAfter * 1000);
        if (sequence !== state.sequence || phone !== smsPhone(purpose)) return;
        state.challengeId = result.challengeId;
        state.expiresAt = now + result.expiresIn * 1000;
        showLoginStatus('验证码已发送，请查看手机短信。', 'info');
      } catch (error) {
        if (Number.isFinite(error.retryAfter) && error.retryAfter > 0) smsCooldownUntil.set(phone, Date.now() + Math.min(error.retryAfter, 86400) * 1000);
        if (sequence === state.sequence && phone === smsPhone(purpose)) showLoginStatus(error.message || '验证码发送失败，请稍后重试。');
      } finally {
        pendingSmsPhones.delete(phone);
        if (sequence === state.sequence) state.busy = false;
        updateSmsControls();
      }
    }
    function smsVerification(purpose) {
      if (!smsNeeded(purpose)) return undefined;
      if (!Auth.smsConfigured) throw new Error('短信服务尚未配置，请联系管理员。');
      const state = smsStates[purpose];
      if (!state.challengeId || state.phone !== smsPhone(purpose)) throw new Error('请先获取当前手机号的短信验证码。');
      if (state.expiresAt <= Date.now()) { clearSmsChallenge(purpose); updateSmsControls(); throw new Error('验证码已过期，请重新获取。'); }
      const smsCode = document.getElementById(purpose + 'SmsCode').value.trim();
      if (!/^\d{6}$/.test(smsCode)) throw new Error('请输入6位短信验证码。');
      return { smsCode, smsChallengeId: state.challengeId };
    }
    function showLoginStatus(message, kind) {
      const status = document.getElementById('loginError');
      status.textContent = message;
      status.dataset.kind = kind || 'error';
      status.hidden = false;
    }
    function clearLoginStatus() { document.getElementById('loginError').hidden = true; }
    async function showAuthMode(mode) {
      const sequence = ++authModeSequence;
      if (mode === 'register' && !registrationReady) {
        try { await Store.loadOrganizationSettings(true); }
        catch (error) { if (sequence === authModeSequence) showLoginStatus('注册选项读取失败，请稍后重试：' + error.message); return; }
        if (sequence !== authModeSequence) return;
        document.getElementById('registrationFields').innerHTML = Employees._formHtml(null, { registration: true });
        document.getElementById('empPhone').addEventListener('input', function() { smsPhoneChanged('register'); });
        Employees._pendingResume = { data: '', name: '' };
        Employees._pendingCredential = { data: '', name: '' };
        Employees._resumeText = '';
        registrationReady = true;
      }
      document.getElementById('loginPanel').hidden = mode !== 'login';
      document.getElementById('registerPanel').hidden = mode !== 'register';
      document.getElementById('setupPanel').hidden = mode !== 'setup';
      document.getElementById('loginTab').setAttribute('aria-selected', String(mode === 'login'));
      document.getElementById('registerTab').setAttribute('aria-selected', String(mode === 'register'));
      document.getElementById('authContainer').classList.toggle('registration-mode', mode === 'register');
      clearLoginStatus();
      updateSmsControls();
    }
    function togglePassword(id, button) {
      const input = document.getElementById(id);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      button.textContent = show ? '隐藏' : '显示';
      button.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    }
    async function submitAuth(button, action) {
      if (button.disabled) return;
      const label = button.textContent;
      button.disabled = true;
      button.textContent = '处理中…';
      clearLoginStatus();
      try {
        const result = await action();
        if (!result || !result.success) throw new Error(result && result.message || '操作失败，请重试');
        window.location.href = 'index.html';
      } catch (error) {
        showLoginStatus(error.message || '无法连接服务，请稍后重试');
        button.disabled = false;
        button.textContent = label;
      }
    }
    async function doLogin(event) {
      if (event) event.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!username || !password) { showLoginStatus('请输入手机号或管理账号和密码'); return; }
      let verification;
      try { verification = smsVerification('login'); }
      catch (error) { showLoginStatus(error.message); return; }
      await submitAuth(document.getElementById('loginBtn'), async function() {
        const result = await Auth.login(username, password, verification);
        if (result.success) {
          if (document.getElementById('rememberMe').checked) localStorage.setItem('personnel_remembered_user', username);
          else localStorage.removeItem('personnel_remembered_user');
        }
        return result;
      });
    }
    async function doRegister(event) {
      event.preventDefault();
      const employee = Employees.readFormData();
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;
      if (!employee.name) { showLoginStatus('请输入姓名'); return; }
      if (!/^1[3-9]\d{9}$/.test(employee.phone)) { showLoginStatus('请输入有效的11位手机号'); return; }
      if (password.length < 8) { showLoginStatus('密码至少需要8位'); return; }
      if (password !== confirm) { showLoginStatus('两次密码不一致'); return; }
      if (employee.joinDate && employee.leaveDate && employee.leaveDate < employee.joinDate) { showLoginStatus('离职日期不能早于入职日期'); return; }
      let verification;
      try { verification = smsVerification('register'); }
      catch (error) { showLoginStatus(error.message); return; }
      await submitAuth(document.getElementById('registerBtn'), function() { return Auth.register(employee.phone, password, employee, verification); });
    }
    async function doSetup(event) {
      event.preventDefault();
      const password = document.getElementById('setupPassword').value;
      if (password.length < 12) { showLoginStatus('管理员密码至少需要12位'); return; }
      if (password !== document.getElementById('setupConfirm').value) { showLoginStatus('两次密码不一致'); return; }
      await submitAuth(document.getElementById('setupBtn'), function() { return Auth.setupAdmin(password); });
    }
    document.addEventListener('DOMContentLoaded', async function() {
      document.getElementById('loginForm').addEventListener('submit', doLogin);
      document.getElementById('registerForm').addEventListener('submit', doRegister);
      document.getElementById('setupForm').addEventListener('submit', doSetup);
      document.getElementById('loginUsername').addEventListener('input', function() { smsPhoneChanged('login'); });
      if (window.MobileClient) MobileClient.init();
      const remembered = localStorage.getItem('personnel_remembered_user');
      if (remembered) { document.getElementById('loginUsername').value = remembered; document.getElementById('rememberMe').checked = true; }
      try {
        const status = await Auth.init();
        updateSmsControls();
        smsClock = setInterval(updateSmsControls, 1000);
        document.addEventListener('visibilitychange', updateSmsControls);
        window.addEventListener('pagehide', function() {
          clearInterval(smsClock);
          smsClock = null;
          clearSmsChallenge('login');
          clearSmsChallenge('register');
        });
        window.addEventListener('pageshow', function() {
          if (!smsClock) smsClock = setInterval(updateSmsControls, 1000);
          updateSmsControls();
        });
        if (Auth.isLoggedIn()) { window.location.href = 'index.html'; return; }
        const localHost = ['localhost', '127.0.0.1', '[::1]'].indexOf(window.location.hostname) >= 0;
        document.getElementById('setupEntry').hidden = !(status && status.setupRequired && status.setupAllowed !== false && localHost);
      } catch (error) { showLoginStatus(error.message || '服务连接失败，请确认本地服务已经启动'); }
    });
  </script>
</body>
</html>
